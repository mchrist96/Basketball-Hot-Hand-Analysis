[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hothand"
version = "0.1.0"
description = "NBA play-by-play ingestion for hot hand analysis"
requires-python = ">=3.10"
dependencies = ["nba_api>=1.4", "pandas>=2.0", "pyarrow>=14", "tqdm>=4.66"]

[tool.setuptools.packages.find]
where = ["src"]
